<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>录音转文字工作台</title>
<style>
  :root{--bg:#f6f7fb;--card:#fff;--ink:#1f2330;--sub:#6b7280;--line:#e5e7eb;--blue:#2563eb;--blue-d:#1e40af;--ok:#16a34a;--err:#dc2626;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  .wrap{max-width:960px;margin:0 auto;padding:28px 20px 60px}
  header{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
  h1{font-size:24px}
  .badge{font-size:12px;color:#fff;background:var(--ok);border-radius:99px;padding:2px 10px}
  .sub{color:var(--sub);font-size:13px;margin-bottom:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  #drop{border:2px dashed #c3cad9;border-radius:14px;padding:44px 20px;text-align:center;cursor:pointer;transition:.15s;background:#fbfcfe}
  #drop.hover{border-color:var(--blue);background:#eff6ff}
  #drop .big{font-size:17px;font-weight:600;margin-bottom:6px}
  #drop .fmt{color:var(--sub);font-size:12px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  label{font-size:13px;color:var(--sub)}
  select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff}
  button{padding:8px 16px;border:none;border-radius:8px;font-size:14px;cursor:pointer;background:var(--blue);color:#fff}
  button:hover{background:var(--blue-d)}
  button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  button:disabled{opacity:.5;cursor:not-allowed}
  #bar{height:8px;background:#eef0f5;border-radius:99px;overflow:hidden;margin:14px 0 6px;display:none}
  #barIn{height:100%;width:0;background:linear-gradient(90deg,#3b82f6,#2563eb);transition:width .3s}
  #status{font-size:13px;color:var(--sub)}
  #result{display:none}
  .seg{padding:8px 0;border-bottom:1px dashed var(--line);display:flex;gap:10px;font-size:14px;line-height:1.7}
  .seg .ts{flex:0 0 auto;font-family:Consolas,monospace;color:var(--blue);font-size:12px;padding-top:2px;white-space:nowrap}
  #full{width:100%;min-height:140px;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:14px;line-height:1.8;resize:vertical;font-family:inherit;margin-top:12px}
  .hist{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
  .hist:last-child{border-bottom:none}
  .hist .meta{color:var(--sub);font-size:12px}
  a.dl{color:var(--blue);text-decoration:none;font-size:12px;border:1px solid var(--line);padding:3px 10px;border-radius:6px}
  a.dl:hover{background:#eff6ff}
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;display:none;z-index:9}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>🎙️ 录音转文字工作台</h1><span class="badge">本地离线 · 音频不出电脑</span></header>
  <div class="sub">拖入音频 → 本机模型转写 → 带时间轴文稿，可导出 TXT / DOCX。适合课堂录音、会议记录。</div>

  <div class="card">
    <div id="drop">
      <div class="big">把音频文件拖到这里，或点击选择</div>
      <div class="fmt">支持 m4a / mp3 / wav / flac / aac / ogg / mp4 / amr 等，单文件最大 2GB</div>
      <input id="file" type="file" hidden accept="audio/*,video/mp4,.m4a,.amr,.aac,.flac,.ogg">
    </div>
    <div class="row" style="margin-top:14px">
      <label>语言</label>
      <select id="lang">
        <option value="auto" selected>自动检测</option>
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>
      <span id="fname" style="font-size:13px;color:var(--sub)"></span>
      <span style="flex:1"></span>
      <button id="go" disabled>开始转写</button>
    </div>
    <div id="bar"><div id="barIn"></div></div>
    <div id="status"></div>
  </div>

  <div class="card" id="result">
    <div class="row" style="justify-content:space-between">
      <b>转写结果</b>
      <div class="row">
        <button class="ghost" id="copy">复制全文</button>
        <button id="expT">导出 TXT</button>
        <button id="expD">导出 DOCX</button>
      </div>
    </div>
    <div id="segs" style="margin-top:10px;max-height:320px;overflow:auto"></div>
    <textarea id="full" readonly spellcheck="false"></textarea>
  </div>

  <div class="card">
    <b style="font-size:14px">历史导出记录（保存在 server/输出/）</b>
    <div id="hist" style="margin-top:8px"></div>
  </div>
</div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
let file=null, jobId=null, timer=null;
const drop=$("drop"), fileIn=$("file");

drop.onclick=()=>fileIn.click();
drop.ondragover=e=>{e.preventDefault();drop.classList.add("hover")};
drop.ondragleave=()=>drop.classList.remove("hover");
drop.ondrop=e=>{e.preventDefault();drop.classList.remove("hover");if(e.dataTransfer.files[0])pick(e.dataTransfer.files[0])};
fileIn.onchange=()=>{if(fileIn.files[0])pick(fileIn.files[0])};

function pick(f){file=f;$("fname").textContent=f.name+"（"+(f.size/1048576).toFixed(1)+" MB）";$("go").disabled=false;
  $("result").style.display="none";$("bar").style.display="none";$("status").textContent="";}

function toast(msg,ok=true){const t=$("toast");t.textContent=msg;t.style.display="block";
  t.style.background=ok?"#111827":"#dc2626";setTimeout(()=>t.style.display="none",2600);}

$("go").onclick=async()=>{
  if(!file)return;
  $("go").disabled=true;$("bar").style.display="block";$("barIn").style.width="2%";
  $("status").textContent="上传中…";
  const fd=new FormData();fd.append("file",file);fd.append("lang",$("lang").value);
  try{
    const r=await fetch("/api/upload",{method:"POST",body:fd});
    const j=await r.json();
    if(j.error){toast(j.error,false);reset();return}
    jobId=j.job_id;$("status").textContent="模型加载/转写中…（首次约需十几秒）";
    timer=setInterval(poll,800);
  }catch(e){toast("上传失败："+e,false);reset()}
};

async function poll(){
  const r=await fetch("/api/job/"+jobId);const j=await r.json();
  if(j.status==="error"){$("status").textContent="";toast("转写失败："+j.error,false);reset();return}
  $("barIn").style.width=Math.max(2,j.progress||2)+"%";
  const dur=j.duration?fmtDur(j.duration):"";
  $("status").textContent=(j.status==="done"?"完成":"转写中…")+(dur?"  音频时长 "+dur:"")+(j.status==="done"?"  用时已记录":"");
  if(j.status==="done"){clearInterval(timer);render(j);loadHistory()}
}

function fmtDur(s){s=Math.round(s);return s>=3600?Math.floor(s/3600)+"小时"+Math.floor(s%3600/60)+"分"+s%60+"秒":s>=60?Math.floor(s/60)+"分"+s%60+"秒":s+"秒"}

function ts(sec){sec=Math.floor(sec);const h=String(Math.floor(sec/3600)).padStart(2,"0"),m=String(Math.floor(sec%3600/60)).padStart(2,"0"),s=String(sec%60).padStart(2,"0");return `${h}:${m}:${s}`}

function render(j){
  $("result").style.display="block";
  $("segs").innerHTML=j.segments.map(s=>`<div class="seg"><span class="ts">${ts(s.start)} → ${ts(s.end)}</span><span>${esc(s.text)}</span></div>`).join("");
  $("full").value=j.text;
  $("go").disabled=false;$("barIn").style.width="100%";
}

function esc(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

function reset(){$("bar").style.display="none";$("barIn").style.width="0";$("go").disabled=false;clearInterval(timer)}

async function exportAs(fmt){
  const r=await fetch("/api/export",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({job_id:jobId,format:fmt})});
  const j=await r.json();
  if(j.error){toast(j.error,false);return}
  location.href="/api/open/"+encodeURIComponent(j.filename);
  toast("已导出并保存到 server/输出/："+j.filename);
}
$("expT").onclick=()=>exportAs("txt");
$("expD").onclick=()=>exportAs("docx");
$("copy").onclick=()=>{navigator.clipboard.writeText($("full").value).then(()=>toast("全文已复制"))};

async function loadHistory(){
  const r=await fetch("/api/history");const items=await r.json();
  $("hist").innerHTML=items.length?items.map(it=>`<div class="hist"><span>${esc(it.name)}<span class="meta">　${(it.size/1024).toFixed(1)} KB · ${it.mtime}</span></span><a class="dl" href="/api/open/${encodeURIComponent(it.name)}">下载</a></div>`).join("")
    :'<div style="color:var(--sub);font-size:13px">暂无，转写完成后点「导出」即可。</div>';
}
loadHistory();
</script>
</body>
</html>
